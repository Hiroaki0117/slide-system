[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "slide-system-harness"
version = "0.8.0"
description = "Local, provider-neutral harness for reproducible slide production"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary during prototype development" }
authors = [
  { name = "Hiroaki Nishimura" }
]
dependencies = [
  "jsonschema>=4.23,<5"
]

[project.scripts]
slide-system = "slide_system.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
